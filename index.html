<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>WHAT IS YOUR WISH?</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="css/style.css">


</head>

<body>

<div class="overlay"></div>

<!-- SCREEN 1 -->
<section id="screen1" class="screen active">

    <div class="content">

        <div class="ornament">
            ─── ❦ ───
        </div>

        <h1 class="title">
            WHAT IS YOUR WISH?
        </h1>

        <p class="question">
            The Book of Wishes
        </p>

        <button id="enterBtn">
            ENTER
        </button>

        <p class="warning">
            Only one wish..!
        </p>

    </div>

    <div class="archive-info">

        <p>Established 2004</p>

        <p>21,700 wishes recorded</p>

    </div>

</section>

<!-- SCREEN 2 -->
<section id="screen2" class="screen">

    <div class="content">

        <div class="ornament">
            ─── ❦ ───
        </div>

        <h1 class="title">
            THE BOOK OF WISHES
        </h1>

        <p class="question">
            What is your wish?
        </p>

        <input
            type="text"
            id="wishInput"
            placeholder="I wish..."
            maxlength="100">

        <button id="continueBtn">
            CONTINUE
        </button>

    </div>

</section>

<!-- WARNING POPUP -->

<div id="warningModal" class="modal">

    <div class="modal-box">

        <h2>
            WARNING
        </h2>

        <p>
            This action cannot be reversed.
        </p>

        <p class="wish-number">
            Wish #21701
        </p>

        <div class="modal-buttons">

            <button id="cancelBtn">
                CANCEL
            </button>

            <button id="confirmBtn">
                CONTINUE
            </button>

        </div>

    </div>

</div>

<!-- SCREEN 3 -->
<section id="screen3" class="screen dark-screen">

    <div class="content">

        <h1 class="title">
            PROCESSING
        </h1>

        <p id="statusText">
            Searching records...
        </p>

        <div class="progress-container">

            <div id="progressBar"></div>

        </div>

        <p id="progressPercent">
            0%
        </p>

    </div>

</section>

<!-- SCREEN 4 -->
<section id="screen4" class="screen black-screen">

</section>

<!-- SCREEN 5 -->

<section id="screen5" class="screen black-screen">

    <div class="granted-container">

        <h1 class="granted-title">

          <span>W I S H</span>

          <span>G R A N T E D</span>

        </h1>

        <p class="wish-id">
            Wish #21701
        </p>

    </div>

</section>

<script src="js/script.js"></script>


</body>

</html>
